<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bảng Điểm CTDT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: Arial, sans-serif; background-color: #f8f9fa; }
        .excel-table { border-collapse: collapse; width: 100%; font-size: 13px; }
        .excel-table th, .excel-table td { border: 1px solid #c0c0c0; padding: 6px 8px; text-align: center; }
        .excel-table th { background-color: #e2efda; font-weight: bold; color: #1f4e78; position: sticky; top: 0; z-index: 10; }
        .excel-table td.text-left { text-align: left; }
        .excel-table tr:hover { background-color: #f1f8ff; }
        .excel-table .course-group { background-color: #d9e1f2; font-weight: bold; text-align: left; }
        .excel-table .summary-row { font-weight: bold; background-color: #fff2cc; }
        
        .score-input { width: 100%; border: none; background: transparent; text-align: center; font-family: inherit; font-size: inherit; outline: none; }
        .score-input:focus { background-color: #e8f0fe; }
        
        .sticky-col-1 { position: sticky; left: 0; z-index: 5; background-color: inherit; }
        .sticky-col-2 { position: sticky; left: 0; z-index: 5; background-color: inherit; box-shadow: 3px 0 5px -2px rgba(0,0,0,0.1); }
        .excel-table th.sticky-col-1, .excel-table th.sticky-col-2 { z-index: 15; }
        
        @media (min-width: 768px) {
            .sticky-col-2 { left: 40px; }
        }
        
        /* Custom scrollbar for table container */
        .table-container { max-height: 80vh; overflow: auto; background: white; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="p-4 flex flex-col h-screen">

    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 gap-4">
        <div>
            <h1 class="text-xl md:text-2xl font-bold text-blue-800">BẢNG ĐIỂM THEO CHƯƠNG TRÌNH ĐÀO TẠO</h1>
            <p class="text-xs md:text-sm text-gray-600 mt-1">Nhập điểm trực tiếp vào các ô dưới học kỳ. Check vào cột "Tính điểm" nếu môn đó tính vào GPA.</p>
        </div>
        <div class="flex flex-wrap gap-2">
            <button id="view-toggle-btn" onclick="toggleView()" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-800 px-4 py-2 rounded text-sm font-medium shadow border border-indigo-200">
                <i class="fa-solid fa-list mr-1"></i> Xem dạng thẻ
            </button>
            <button onclick="undo()" class="bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 rounded text-sm font-medium shadow" title="Hoàn tác (Ctrl+Z)">
                <i class="fa-solid fa-rotate-left mr-1"></i> Hoàn tác
            </button>
            <button onclick="addCourse()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm font-medium shadow">
                <i class="fa-solid fa-plus mr-1"></i> Thêm môn học
            </button>
            <button onclick="addSemester()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded text-sm font-medium shadow">
                <i class="fa-solid fa-plus mr-1"></i> Thêm học kỳ
            </button>
            <button onclick="loadSample()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-4 py-2 rounded text-sm font-medium shadow">
                Dữ liệu mẫu
            </button>
            <button onclick="clearData()" class="bg-red-100 hover:bg-red-200 text-red-700 px-4 py-2 rounded text-sm font-medium shadow">
                Làm mới
            </button>
        </div>
    </div>

    <!-- Dashboard Summary -->
    <div id="academic-summary" class="bg-white p-3 rounded shadow-sm border border-gray-200 mb-4 grid grid-cols-2 md:grid-cols-4 gap-4">
        <div>
            <div class="text-[10px] text-gray-500 font-bold uppercase tracking-wider">Tổng TC Tích luỹ</div>
            <div class="font-bold text-blue-700 text-lg md:text-xl" id="summary-tc">0</div>
        </div>
        <div>
            <div class="text-[10px] text-gray-500 font-bold uppercase tracking-wider">ĐTB Tích luỹ</div>
            <div class="font-bold text-red-600 text-lg md:text-xl" id="summary-gpa">0.00</div>
        </div>
        <div>
            <div class="text-[10px] text-gray-500 font-bold uppercase tracking-wider">Trình độ</div>
            <div class="font-bold text-green-700 text-lg md:text-xl" id="summary-level">-</div>
        </div>
        <div>
            <div class="text-[10px] text-gray-500 font-bold uppercase tracking-wider">Dự kiến TN</div>
            <div class="font-bold text-purple-700 text-lg md:text-xl" id="summary-grad">-</div>
        </div>
    </div>
    
    <div id="warning-alert" class="bg-red-50 text-red-700 p-3 rounded mb-4 border border-red-200 text-sm hidden font-medium">
        <i class="fa-solid fa-triangle-exclamation mr-1"></i> <span id="warning-text"></span>
    </div>

    <div id="table-container" class="table-container flex-1 border border-gray-300">
        <table class="excel-table" id="ctdt-table">
            <thead>
                <tr id="header-row">
                    <!-- JS will populate -->
                </tr>
            </thead>
            <tbody id="table-body">
                <!-- JS will populate -->
            </tbody>
            <tfoot id="table-foot">
                <!-- JS will populate -->
            </tfoot>
        </table>
    </div>

    <!-- Card View -->
    <div id="cards-container" class="hidden flex-1 overflow-y-auto pb-20">
        <div id="cards-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
            <!-- JS will populate cards here -->
        </div>
    </div>

    <!-- Sticky Summary Bar (Visible in Card View) -->
    <div id="mobile-summary-bar" class="hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-3 flex justify-around items-center z-40 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)]">
        <div class="text-center">
            <div class="text-[10px] text-gray-500 font-bold uppercase tracking-wider">Tín chỉ tích luỹ</div>
            <div class="font-bold text-blue-700 text-lg" id="mobile-total-tc">0</div>
        </div>
        <div class="h-8 w-px bg-gray-300"></div>
        <div class="text-center">
            <div class="text-[10px] text-gray-500 font-bold uppercase tracking-wider">ĐTB tích luỹ</div>
            <div class="font-bold text-red-600 text-lg" id="mobile-total-gpa">0.00</div>
        </div>
    </div>

    <!-- Modal Form -->
    <div id="course-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md mx-4">
            <div class="px-6 py-4 border-b flex justify-between items-center bg-gray-50 rounded-t-lg">
                <h3 class="text-lg font-bold text-gray-800">Thêm Môn Học Mới</h3>
                <button onclick="closeCourseModal()" class="text-gray-400 hover:text-gray-600">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <form id="add-course-form" class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Mã Học Phần</label>
                    <input type="text" id="modal-maHP" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500" placeholder="VD: INT101">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Tên Học Phần</label>
                    <input type="text" id="modal-tenHP" required class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500" placeholder="VD: Lập trình C++">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Số Tín Chỉ</label>
                    <input type="number" id="modal-tc" min="1" step="0.5" required class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500" value="3">
                </div>
                <div class="flex items-center pt-2">
                    <input type="checkbox" id="modal-tinhGPA" checked class="w-4 h-4 text-blue-600 rounded">
                    <label for="modal-tinhGPA" class="ml-2 text-sm font-semibold text-gray-700">Tính vào ĐTB (GPA)</label>
                </div>
                <div class="pt-4 flex justify-end gap-2 mt-4 border-t pt-4">
                    <button type="button" onclick="closeCourseModal()" class="px-4 py-2 text-sm text-gray-700 bg-gray-100 hover:bg-gray-200 rounded">Huỷ</button>
                    <button type="submit" class="px-4 py-2 text-sm text-white bg-blue-600 hover:bg-blue-700 rounded shadow">Thêm Môn</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js?v=3"></script>
</body>
</html>
